; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; BNO085 (GY-BM008X) IMU in UART-RVC mode via the Adafruit BNO08x RVC library.
lib_deps =
    adafruit/Adafruit BNO08x RVC

; Step A calibration: real BNO085 driver + serial dump of roll/pitch/yaw+gyro.
; For normal operation, comment this line out.
; To bench-test with NO sensor wired, use -DIMU_USE_STUB=1 instead (pitch=0).
; MOTOR_TEST=1 spins both wheels slowly at power-up with NO safety gates —
; wheels off the ground. Remove it as soon as the UART link is verified.
build_flags = -DIMU_DEBUG_EULER=1 -DIMU_UART_RAW_DUMP=1 -DMOTOR_TEST=1
