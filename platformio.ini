; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; BNO085 (GY-BM008X) IMU in UART-RVC mode via the Adafruit BNO08x RVC library.
lib_deps =
    adafruit/Adafruit BNO08x RVC

; Step A calibration: real BNO085 driver + serial dump of roll/pitch/yaw+gyro.
; For normal operation, comment this line out.
; To bench-test with NO sensor wired, use -DIMU_USE_STUB=1 instead (pitch=0).
; PID_DEBUG prints controller internals on USB serial for gain tuning.
; (Swap back to -DIMU_DEBUG_EULER=1 if you need the raw Euler stream, e.g.
; for tools/imu_visualizer.py or re-doing the mounting calibration.)
;build_flags = -DPID_DEBUG=1
