<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BizBot Sim</title>
<style>
  :root { --bg:#1d1d1b; --card:#262624; --line:#3a3a38; --text:#e8e6dc; --muted:#8a8a84; --blue:#3987e5; --orange:#d95926; --green:#5aa469; --red:#d64545; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px system-ui, sans-serif; }
  header { padding:10px 16px; display:flex; gap:16px; align-items:center; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; }
  #status { color:var(--muted); font-variant-numeric:tabular-nums; }
  #fault { color:var(--red); font-weight:600; }
  .wrap { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .left { flex:1; min-width:0; }
  canvas { width:100%; background:var(--card); border-radius:8px; display:block; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  button { background:#34342f; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { background:#3e3e38; }
  button.on { background:var(--green); border-color:var(--green); color:#111; }
  .hint { color:var(--muted); }
  .right { width:340px; flex:none; max-height:calc(100vh - 80px); overflow:auto; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 12px; padding:8px 10px; }
  legend { color:var(--muted); padding:0 4px; }
  .row { display:grid; grid-template-columns:120px 1fr 58px; gap:6px; align-items:center; margin:4px 0; }
  .row label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row input[type=number] { width:58px; background:#1a1a18; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 4px; font:inherit; }
  .row input[type=range] { width:100%; }
  .row select { grid-column:2 / 4; background:#1a1a18; color:var(--text); border:1px solid var(--line); border-radius:4px; font:inherit; }
  .note { color:var(--muted); font-size:12px; margin:4px 0 0; }
  @media (max-width: 900px) { .wrap { flex-direction:column; } .right { width:100%; max-height:none; } }
</style>
</head>
<body>
<header>
  <h1>BizBot balance sim</h1>
  <span id="status"></span>
  <span id="fault"></span>
</header>
<div class="wrap">
  <div class="left">
    <canvas id="world" width="900" height="340"></canvas>
    <div class="btns">
      <button id="pushB">◀ push back</button>
      <button id="pushF">push forward ▶</button>
      <button id="enable" class="on">Balancing ON</button>
      <button id="reset">Reset</button>
      <button id="pause">Pause</button>
      <span class="hint">Hold ← / → to keep pushing. Space = push forward.</span>
    </div>
    <canvas id="plot" width="900" height="420"></canvas>
  </div>
  <div class="right" id="controls"></div>
</div>
<script>
// Mirrors the firmware control path: src/main.cpp runControlLoop + velocityLoop,
// src/control/PID.cpp, src/hal/Imu.cpp rate filter, src/config.h limits.
// The plant is a wheeled inverted pendulum whose wheels follow a speed
// command through a first-order lag (EFeru speed mode, assumed).

const PARAMS = [
  ["Firmware", [
    ["kp", "kp", 0, 2, 0.005, 0.12],
    ["ki", "ki", 0, 1, 0.001, 0.664],
    ["kd", "kd", 0, 0.05, 0.0005, 0.015],
    ["vkp", "vkp", 0, 1, 0.005, 0.025],
    ["vki", "vki", 0, 1, 0.005, 0.075],
    ["velSign", "VEL_SIGN", [-1, 1], 1],
    ["cap", "MAX_BALANCE_OUTPUT", 0.05, 1, 0.05, 0.45],
    ["maxCmd", "MAX_HOVERBOARD_CMD", 100, 1000, 50, 500],
    ["alpha", "rate LPF alpha", 0.05, 1, 0.05, 0.15],
    ["velCap", "MAX_VEL_LEAN_DEG", 0, 10, 0.5, 3],
    ["trim", "trim (deg)", -10, 10, 0.1, 0],
  ]],
  ["Robot (placeholders, measure these)", [
    ["l", "COM height (m)", 0.1, 1.2, 0.01, 0.45],
    ["kg", "radius of gyration (m)", 0, 0.6, 0.01, 0.2],
    ["mass", "body mass (kg)", 5, 80, 1, 20],
    ["r", "wheel radius (m)", 0.05, 0.15, 0.0025, 0.0825],
    ["xoff", "weight shift fwd (cm)", -15, 15, 0.5, 0],
  ]],
  ["Hoverboard (unknown, measure)", [
    ["rpmPerCmd", "RPM per command", 0.05, 2, 0.01, 0.35],
    ["tau", "speed lag tau (s)", 0.01, 0.5, 0.01, 0.08],
    ["aMax", "max accel (m/s²)", 0.5, 20, 0.5, 5],
    ["deadband", "deadband (cmd)", 0, 150, 5, 0],
  ]],
  ["Sensors", [
    ["noise", "pitch noise σ (deg)", 0, 0.5, 0.01, 0.05],
    ["imuDelay", "IMU latency (ms)", 0, 60, 1, 10],
    ["fbAlive", "wheel feedback", ["alive", "dead"], "alive"],
  ]],
  ["Push", [
    ["pushN", "force (N)", 0, 300, 5, 60],
    ["pushMs", "duration (ms)", 20, 1000, 10, 150],
  ]],
];

const P = {};
const controls = document.getElementById("controls");
for (const [group, list] of PARAMS) {
  const fs = document.createElement("fieldset");
  fs.innerHTML = `<legend>${group}</legend>`;
  for (const spec of list) {
    const [key, label] = spec;
    const row = document.createElement("div");
    row.className = "row";
    if (Array.isArray(spec[2])) {
      const opts = spec[2];
      P[key] = spec[3];
      row.innerHTML = `<label title="${label}">${label}</label><select>${opts.map((o) => `<option ${o === spec[3] ? "selected" : ""}>${o}</option>`).join("")}</select>`;
      const sel = row.querySelector("select");
      sel.onchange = () => { P[key] = isNaN(Number(sel.value)) ? sel.value : Number(sel.value); };
    } else {
      const [, , min, max, step, def] = spec;
      P[key] = def;
      row.innerHTML = `<label title="${label}">${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${def}"><input type="number" step="${step}" value="${def}">`;
      const [range, num] = row.querySelectorAll("input");
      range.oninput = () => { P[key] = Number(range.value); num.value = range.value; };
      num.onchange = () => { const v = Number(num.value); if (Number.isFinite(v)) { P[key] = v; range.value = v; } };
    }
    fs.appendChild(row);
  }
  controls.appendChild(fs);
}
const note = document.createElement("p");
note.className = "note";
note.textContent = "Robot and hoverboard values are guesses until measured. Body mass only affects pushes; balance depends on COM height, gyration and the hoverboard response.";
controls.appendChild(note);

// --- simulation state ---------------------------------------------------------
const G = 9.81, DT = 0.0005, CTRL_DT = 0.005, IMU_DT = 0.01, FB_DT = 0.01;
const RAD = Math.PI / 180;
let S;
function reset() {
  S = {
    t: 0, x: 0, v: 0, th: 0.5 * RAD, w: 0,
    enabled: true, fault: "",
    // firmware state
    pitch: 0, prevPitch: null, rate: 0, imuT: 0, ctrlT: 0, fbT: 0,
    integral: 0, velIntegral: 0, target: 0, rpmMeas: 0, cmd: 0, out: 0,
    hist: [], log: [], pushUntil: 0, pushDir: 0, onGround: false,
  };
  setEnabledButton();
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

function disable(reason) {
  S.enabled = false;
  S.fault = reason;
  S.integral = 0; S.velIntegral = 0; S.target = 0; S.cmd = 0; S.out = 0;
  setEnabledButton();
}

// Firmware: one control tick (src/main.cpp runControlLoop).
function controlTick() {
  if (!S.enabled) { S.cmd = 0; return; }
  if (Math.abs(S.pitch) > 35) { disable("FAULT TILT_LIMIT"); return; }

  // velocityLoop()
  const active = P.vkp > 0 || P.vki > 0;
  if (!active) {
    S.velIntegral = 0;
    S.target = 0;
  } else if (P.fbAlive === "alive") {
    const vErr = 0 - S.rpmMeas;
    S.velIntegral += vErr * CTRL_DT;
    if (P.vki > 0) { const lim = P.velCap / P.vki; S.velIntegral = clamp(S.velIntegral, -lim, lim); }
    S.target = clamp(P.velSign * (P.vkp * vErr + P.vki * S.velIntegral), -P.velCap, P.velCap);
  } // stale feedback: hold last target

  // PID::update
  const err = S.target - S.pitch;
  S.integral += err * CTRL_DT;
  if (P.ki !== 0) { const lim = P.cap / Math.abs(P.ki); S.integral = clamp(S.integral, -lim, lim); }
  S.out = clamp(P.kp * err + P.ki * S.integral + P.kd * -S.rate, -P.cap, P.cap);

  // BALANCE_MOTOR_SIGN = -1, then normalizedToHoverboard
  const speed = clamp(-S.out, -P.cap, P.cap);
  S.cmd = Math.trunc(clamp(speed, -1, 1) * P.maxCmd);
}

// Firmware: IMU packet (src/hal/Imu.cpp), sampled with latency.
function imuTick() {
  const delayed = sampleHistory(S.t - P.imuDelay / 1000);
  const p = delayed / RAD + P.noise * randn() - P.trim;
  if (S.prevPitch !== null) {
    const raw = (p - S.prevPitch) / IMU_DT;
    S.rate += P.alpha * (raw - S.rate);
  }
  S.prevPitch = p;
  S.pitch = p;
}
function sampleHistory(t) {
  const h = S.hist;
  for (let i = h.length - 1; i >= 0; i--) if (h[i][0] <= t) return h[i][1];
  return h.length ? h[0][1] : S.th;
}

// Plant: wheels track a speed command; body is a pendulum on an accelerating base.
function physicsStep() {
  let cmd = S.cmd;
  if (Math.abs(cmd) < P.deadband) cmd = 0;
  const vTarget = cmd * P.rpmPerCmd * 2 * Math.PI * P.r / 60;
  const a = clamp((vTarget - S.v) / P.tau, -P.aMax, P.aMax);

  const lx = P.xoff / 100;
  const L = Math.hypot(P.l, lx);
  const phi0 = Math.atan2(lx, P.l);
  const ang = S.th + phi0;
  const J = P.kg * P.kg + L * L;
  const F = (S.t < S.pushUntil ? S.pushDir : 0) + keyForce();
  let thdd = (L * (G * Math.sin(ang) - a * Math.cos(ang))) / J + (F * P.l * Math.cos(S.th)) / (P.mass * J);

  S.v += a * DT;
  S.x += S.v * DT;
  if (S.onGround) { thdd = 0; S.w = 0; }
  S.w += thdd * DT;
  S.th += S.w * DT;
  if (Math.abs(S.th) >= Math.PI / 2) { S.th = Math.sign(S.th) * Math.PI / 2; S.w = 0; S.onGround = true; }
  S.t += DT;
  S.hist.push([S.t, S.th]);
  if (S.hist.length > 400) S.hist.shift();
}

function step() {
  physicsStep();
  if (S.t >= S.imuT) { S.imuT += IMU_DT; imuTick(); }
  if (S.t >= S.fbT) { S.fbT += FB_DT; S.rpmMeas = (S.v / (2 * Math.PI * P.r)) * 60; }
  if (S.t >= S.ctrlT) {
    S.ctrlT += CTRL_DT;
    controlTick();
    if (Math.round(S.t / CTRL_DT) % 2 === 0) {
      S.log.push({ t: S.t, pitch: S.pitch, target: S.target, rpm: S.rpmMeas, cmd: S.cmd, F: (S.t < S.pushUntil ? S.pushDir : 0) + keyForce() });
      while (S.log.length && S.log[0].t < S.t - 10) S.log.shift();
    }
  }
}

// --- input -------------------------------------------------------------------
const held = new Set();
function keyForce() { return (held.has("ArrowRight") ? P.pushN : 0) - (held.has("ArrowLeft") ? P.pushN : 0); }
function push(dir) { S.pushDir = dir * P.pushN; S.pushUntil = S.t + P.pushMs / 1000; }
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { held.add(e.key); e.preventDefault(); }
  if (e.key === " ") { push(1); e.preventDefault(); }
});
window.addEventListener("keyup", (e) => held.delete(e.key));
document.getElementById("pushF").onclick = () => push(1);
document.getElementById("pushB").onclick = () => push(-1);
document.getElementById("reset").onclick = () => reset();
let paused = false;
document.getElementById("pause").onclick = (e) => { paused = !paused; e.target.textContent = paused ? "Resume" : "Pause"; };
const enBtn = document.getElementById("enable");
enBtn.onclick = () => {
  if (S.enabled) disable("");
  else { S.enabled = true; S.fault = ""; S.integral = 0; S.velIntegral = 0; setEnabledButton(); }
};
function setEnabledButton() {
  enBtn.classList.toggle("on", S.enabled);
  enBtn.textContent = S.enabled ? "Balancing ON" : "Balancing OFF";
}

// --- drawing -----------------------------------------------------------------
const world = document.getElementById("world");
const wc = world.getContext("2d");
function drawWorld() {
  const W = world.width, H = world.height;
  wc.clearRect(0, 0, W, H);
  const scale = 300; // px per metre
  const groundY = H - 40;
  const cx = W / 2;
  // ground with ticks that scroll so motion is visible
  wc.strokeStyle = "#3a3a38"; wc.lineWidth = 2;
  wc.beginPath(); wc.moveTo(0, groundY); wc.lineTo(W, groundY); wc.stroke();
  wc.fillStyle = "#8a8a84"; wc.font = "11px system-ui"; wc.textAlign = "center";
  const metres = W / scale;
  for (let m = Math.floor(S.x - metres); m <= S.x + metres; m += 0.25) {
    const px = cx + (m - S.x) * scale;
    const major = Math.abs(m - Math.round(m)) < 1e-6;
    wc.beginPath(); wc.moveTo(px, groundY); wc.lineTo(px, groundY + (major ? 12 : 6)); wc.stroke();
    if (major) wc.fillText(`${Math.round(m)} m`, px, groundY + 26);
  }
  const r = P.r * scale;
  const wy = groundY - r;
  // body
  const len = 2 * P.l * scale;
  const tx = cx + Math.sin(S.th) * len, ty = wy - Math.cos(S.th) * len;
  wc.strokeStyle = "#c3c2b7"; wc.lineWidth = 10; wc.lineCap = "round";
  wc.beginPath(); wc.moveTo(cx, wy); wc.lineTo(tx, ty); wc.stroke();
  // centre of mass (with weight shift)
  const lx = P.xoff / 100;
  const comX = cx + (Math.sin(S.th) * P.l + Math.cos(S.th) * lx) * scale;
  const comY = wy - (Math.cos(S.th) * P.l - Math.sin(S.th) * lx) * scale;
  wc.fillStyle = "#d95926"; wc.beginPath(); wc.arc(comX, comY, 7, 0, Math.PI * 2); wc.fill();
  // wheel with a spoke so rotation shows
  wc.strokeStyle = "#3987e5"; wc.lineWidth = 4;
  wc.beginPath(); wc.arc(cx, wy, r, 0, Math.PI * 2); wc.stroke();
  const rot = S.x / P.r;
  wc.beginPath(); wc.moveTo(cx, wy); wc.lineTo(cx + Math.sin(rot) * r, wy - Math.cos(rot) * r); wc.stroke();
  // push arrow
  const F = (S.t < S.pushUntil ? S.pushDir : 0) + keyForce();
  if (F) {
    const ay = wy - Math.cos(S.th) * P.l * scale, ax = cx + Math.sin(S.th) * P.l * scale;
    const dir = Math.sign(F), start = ax - dir * 90;
    wc.strokeStyle = "#d64545"; wc.fillStyle = "#d64545"; wc.lineWidth = 4;
    wc.beginPath(); wc.moveTo(start, ay); wc.lineTo(ax - dir * 14, ay); wc.stroke();
    wc.beginPath(); wc.moveTo(ax, ay); wc.lineTo(ax - dir * 16, ay - 8); wc.lineTo(ax - dir * 16, ay + 8); wc.fill();
  }
}

const plot = document.getElementById("plot");
const pc = plot.getContext("2d");
function drawPlots() {
  const W = plot.width, H = plot.height;
  pc.clearRect(0, 0, W, H);
  const panels = [
    { title: "pitch (blue) / target (orange), deg", series: [["pitch", "#3987e5"], ["target", "#d95926"]], min: 4 },
    { title: "wheel RPM", series: [["rpm", "#5aa469"]], min: 10 },
    { title: "hoverboard command (dashed = cap)", series: [["cmd", "#c3c2b7"]], fixed: P.cap * P.maxCmd * 1.15, capLine: P.cap * P.maxCmd },
  ];
  const ph = H / panels.length;
  const pad = { l: 44, r: 8, t: 18, b: 8 };
  const t1 = S.t, t0 = t1 - 10;
  panels.forEach((p, i) => {
    const y0 = i * ph;
    let range = p.fixed || p.min;
    if (!p.fixed) for (const s of S.log) for (const [k] of p.series) range = Math.max(range, Math.abs(s[k]) * 1.1);
    const X = (t) => pad.l + ((t - t0) / 10) * (W - pad.l - pad.r);
    const Y = (v) => y0 + pad.t + (ph - pad.t - pad.b) / 2 - (v / range) * ((ph - pad.t - pad.b) / 2);
    pc.strokeStyle = "#3a3a38"; pc.lineWidth = 1;
    pc.beginPath(); pc.moveTo(pad.l, Y(0)); pc.lineTo(W - pad.r, Y(0)); pc.stroke();
    pc.fillStyle = "#8a8a84"; pc.font = "11px system-ui"; pc.textAlign = "left";
    pc.fillText(p.title, pad.l, y0 + 12);
    pc.textAlign = "right";
    pc.fillText(range.toFixed(range < 10 ? 1 : 0), pad.l - 6, Y(range) + 10);
    pc.fillText((-range).toFixed(range < 10 ? 1 : 0), pad.l - 6, Y(-range));
    if (p.capLine) {
      pc.setLineDash([4, 4]); pc.strokeStyle = "#d64545";
      for (const c of [p.capLine, -p.capLine]) { pc.beginPath(); pc.moveTo(pad.l, Y(c)); pc.lineTo(W - pad.r, Y(c)); pc.stroke(); }
      pc.setLineDash([]);
    }
    // shade pushes
    pc.fillStyle = "rgba(214,69,69,0.12)";
    for (const s of S.log) if (s.F) pc.fillRect(X(s.t), y0 + pad.t, 2, ph - pad.t - pad.b);
    for (const [k, color] of p.series) {
      pc.strokeStyle = color; pc.lineWidth = 1.6; pc.beginPath();
      S.log.forEach((s, j) => { const px = X(s.t), py = Y(clamp(s[k], -range, range)); j ? pc.lineTo(px, py) : pc.moveTo(px, py); });
      pc.stroke();
    }
  });
}

// --- main loop -----------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const elapsed = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) for (let n = Math.round(elapsed / DT); n > 0; n--) step();
  drawWorld();
  drawPlots();
  const sat = Math.abs(S.cmd) >= Math.trunc(P.cap * P.maxCmd);
  document.getElementById("status").textContent =
    `t ${S.t.toFixed(1)} s · pitch ${S.pitch.toFixed(2)}° · target ${S.target.toFixed(2)}° · wheel ${S.rpmMeas.toFixed(0)} RPM · cmd ${S.cmd}${sat ? " (SATURATED)" : ""}`;
  document.getElementById("fault").textContent = S.fault || (S.onGround ? "fallen" : "");
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
